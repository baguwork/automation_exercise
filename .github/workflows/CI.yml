name: Python Tests + Allure Report

on:
  schedule:
    - cron: "0 7 * * *"  # каждый день в 07:00 UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install allure-pytest

    - name: Run tests with Allure
      run: |
        mkdir -p allure-results
        pytest the_lucky_date_test/API_test/search_module_api_test/test --alluredir=allure-results
      continue-on-error: true

    - name: Generate Allure report
      uses: simple-elf/allure-report-action@master
      with:
        allure_results: allure-results
        allure_report: allure-report
        keep_reports: true

    - name: Upload Allure report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Allure-report
        path: allure-report

    - name: Run tests with logging
      run: |
        mkdir -p logs
        pytest the_lucky_date_test/API_test/search_module_api_test/test --alluredir=allure-results | tee logs/test_log.txt
      continue-on-error: true

    - name: Show last lines of log
      run: tail -n 20 logs/test_log.txt

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: logs/test_log.txt

